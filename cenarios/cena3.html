<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cenário 3 · A Câmara Fria</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

:root{
  --escuro:#1a110d;
  --madeira:#4a3428;
  --madeira-escura:#2C221E;
  --papel:#FDF6E2;
  --tinta:#2C221E;
  --tomate:#D9534F;
  --latao:#E6B800;
  --suave:#7a6652;
  --titulo:'Press Start 2P',monospace;
  --texto:'VT323',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
html,body{height:100%}
body{
  display:grid;
  grid-template-rows:auto 1fr auto auto;
  height:100vh;
  overflow:hidden;
  background-color:var(--escuro);
  color:var(--papel);
  font-family:var(--texto);
  font-size:1.4rem;
  line-height:1.3;
  image-rendering:pixelated;
}
:focus-visible{outline:4px solid var(--latao);outline-offset:4px}

#header-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:12px 20px;
  background:var(--escuro);
  border-bottom:4px solid var(--latao);
}
.grupo-esq{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.voltar{
  display:inline-block;
  padding:10px 14px;
  background:var(--madeira-escura);
  border:4px solid var(--latao);
  color:var(--latao);
  text-decoration:none;
  font-family:var(--titulo);
  font-size:.65rem;
  line-height:1.4;
  box-shadow:4px 4px 0 0 rgba(0,0,0,.6);
}
.voltar:hover{background:var(--latao);color:var(--escuro)}
#header-bar .cenario{font-family:var(--titulo);font-size:.7rem;line-height:1.6;text-align:center}
#cronometro{
  font-family:var(--titulo);
  font-size:1rem;
  color:var(--latao);
  background:var(--madeira-escura);
  border:4px solid var(--latao);
  padding:8px 12px;
}
#cronometro.urgente{color:var(--tomate);border-color:var(--tomate)}

#game-stage{display:grid;place-items:center;padding:12px;min-height:0;background:#0d0806}
.cena{
  position:relative;
  width:min(100%,calc((100vh - 250px)*1.8333));
  aspect-ratio:1408/768;
  background:var(--madeira-escura);
  border:6px solid var(--escuro);
  box-shadow:0 0 0 4px var(--latao),12px 12px 0 4px rgba(0,0,0,.6);
}
.cena img{display:block;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;user-select:none;-webkit-user-drag:none}
.cena.sem-imagem img{display:none}
.cena.sem-imagem::before{
  content:"Salve a imagem do cenário em IMG/cenario3.jpg";
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  padding:20px;
  text-align:center;
  font-size:1.6rem;
}

.interactive-node{
  position:absolute;
  display:block;
  z-index:2;
}
.interactive-node::after{
  content:attr(data-nome);
  position:absolute;
  left:50%;
  bottom:calc(100% + 8px);
  transform:translateX(-50%);
  white-space:nowrap;
  background:var(--escuro);
  color:var(--papel);
  border:3px solid var(--latao);
  padding:2px 10px;
  font-family:var(--texto);
  font-size:1.2rem;
  opacity:0;
  pointer-events:none;
  z-index:5;
}
.interactive-node.r-baixo::after{bottom:auto;top:calc(100% + 8px)}
.interactive-node.r-esq::after{left:0;transform:none}
.interactive-node.r-dir::after{left:auto;right:0;transform:none}
.interactive-node.r-meio::after{bottom:auto;top:14px;left:14px;transform:none}
.interactive-node:hover,.interactive-node:focus-visible{
  z-index:4;
  background:rgba(255,255,255,.22);
  outline:none;
}
.interactive-node:hover::after,.interactive-node:focus-visible::after{opacity:1}
.cena.debug .interactive-node{background:rgba(0,255,120,.18);outline:2px solid #00ff78}
.cena.debug .interactive-node::after{opacity:1}

#no-armario{left:0;top:0;width:13%;height:18%}
#no-geladeira-esq{left:0;top:19%;width:12.6%;height:81%}
#no-porta{left:19.2%;top:14%;width:11.3%;height:84%}
#no-teclado{left:12.9%;top:32.5%;width:6.2%;height:33.5%}
#no-termostato{left:19.4%;top:45%;width:5%;height:18.5%;z-index:3}
#no-geladeira-meio{left:31.1%;top:16.3%;width:8.4%;height:67%}
#no-caixas-esq{left:25.3%;top:4.5%;width:5.6%;height:15%}
#no-poster{left:41%;top:22.4%;width:22.4%;height:40.8%}
#no-lampada{left:55.2%;top:7%;width:3.4%;height:11.5%}
#no-gelo{left:31%;top:74%;width:34%;height:26%}
#no-caixas-dir{left:66.8%;top:0;width:10.4%;height:18%}
#no-pote3a{left:77.3%;top:19.5%;width:5.6%;height:11.2%}
#no-pote3b{left:83%;top:13.4%;width:6.8%;height:17.5%}
#no-pote11{left:90.1%;top:6%;width:9.9%;height:19.5%}
#no-potes-med{left:66.8%;top:41%;width:6.6%;height:25.5%}
#no-misturador{left:76.6%;top:30.9%;width:20.6%;height:25.8%}
#no-caixa{left:77.8%;top:60%;width:19.7%;height:27.6%}
#no-recip-baixo{left:77.4%;top:88%;width:13%;height:12%}

.luz{
  display:none;
  position:absolute;
  inset:0;
  background:rgba(60,230,110,.4);
  mix-blend-mode:screen;
  box-shadow:0 0 36px 12px rgba(60,230,110,.6);
  pointer-events:none;
}
#no-caixa.aberta .luz{display:block}
#no-teclado.aberta .luz{display:block}

#mensagem{
  min-height:3.2rem;
  padding:8px 20px;
  background:var(--madeira-escura);
  border-top:4px solid var(--latao);
  font-size:1.5rem;
}
#inventory-bar{
  display:flex;
  gap:12px;
  padding:10px 20px;
  background:var(--escuro);
  border-top:4px solid var(--latao);
  overflow-x:auto;
}
.slot{
  flex:0 0 64px;
  height:64px;
  display:grid;
  place-items:center;
  font-size:2rem;
  border:4px dashed var(--suave);
  background:var(--madeira);
  box-shadow:inset 4px 4px 0 0 rgba(0,0,0,.35);
}
.slot.cheio{border-style:solid;border-color:var(--latao);background:var(--madeira-escura);cursor:pointer}
.slot.ativo{background:var(--latao);transform:translate(-3px,-3px);box-shadow:5px 5px 0 0 var(--escuro)}

#modal-overlay{
  position:fixed;
  inset:0;
  z-index:20;
  display:grid;
  place-items:center;
  padding:16px;
  background:rgba(10,6,4,.82);
}
.modal{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  padding:24px;
  background:var(--papel);
  color:var(--tinta);
  border:4px solid var(--escuro);
  border-left:16px solid var(--tomate);
  box-shadow:12px 12px 0 0 rgba(0,0,0,.6);
}
.modal-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
#modal-titulo{font-family:var(--titulo);font-weight:400;font-size:.85rem;line-height:1.7}
#modal-fechar{
  flex:0 0 auto;
  width:36px;height:36px;
  background:var(--tomate);
  color:var(--papel);
  border:4px solid var(--escuro);
  font-family:var(--titulo);
  font-size:.8rem;
}
.modal p{font-size:1.5rem;margin-bottom:10px}
.papel{
  padding:16px;
  background:#fffbe9;
  border:3px dashed var(--suave);
  font-size:1.5rem;
}
.papel p+p{margin-top:10px}
.dica-modal{color:var(--suave);margin-top:12px}

.visor{
  margin-bottom:14px;
  padding:16px;
  background:#0b1a0f;
  color:#4cff7a;
  border:4px solid var(--escuro);
  font-family:var(--titulo);
  font-size:1.5rem;
  letter-spacing:.4em;
  text-align:center;
}
.visor.erro{color:#ff5a4f}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.teclado button{
  padding:14px;
  background:var(--madeira-escura);
  color:var(--papel);
  border:4px solid var(--escuro);
  box-shadow:4px 4px 0 0 var(--escuro);
  font-family:var(--titulo);
  font-size:1rem;
}
.teclado button:hover{background:var(--latao);color:var(--escuro)}
.teclado button:active{transform:translate(4px,4px);box-shadow:none}

.trilho{
  position:relative;
  height:48px;
  margin:18px 0 12px;
  background:#cfd8dc;
  border:4px solid var(--escuro);
  touch-action:none;
  cursor:ew-resize;
}
.zona-em{
  position:absolute;
  top:0;bottom:0;
  background:rgba(50,190,95,.9);
  border-left:4px solid var(--escuro);
  border-right:4px solid var(--escuro);
}
.marca{
  position:absolute;
  top:-10px;bottom:-10px;
  width:8px;
  margin-left:-4px;
  background:var(--tomate);
  border:2px solid var(--escuro);
}
.progresso{height:22px;background:#f3e7c4;border:4px solid var(--escuro);margin-bottom:6px}
.progresso-barra{height:100%;width:0;background:var(--tomate)}
.leitura{font-family:var(--titulo);font-size:1rem;text-align:center;margin-bottom:4px}

.btn-pixel{
  display:inline-block;
  margin-top:14px;
  padding:14px 18px;
  background:var(--tomate);
  color:var(--papel);
  border:4px solid var(--escuro);
  box-shadow:6px 6px 0 0 var(--escuro);
  font-family:var(--titulo);
  font-size:.7rem;
  line-height:1.4;
  text-decoration:none;
  cursor:pointer;
}
.btn-pixel:hover{background:var(--latao);color:var(--escuro)}
.btn-pixel:active{transform:translate(4px,4px);box-shadow:none}

.mapa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sala{
  padding:12px 6px;
  background:#f3e7c4;
  border:4px solid var(--escuro);
  font-size:1.25rem;
  text-align:center;
}
.sala.atual{background:var(--latao)}

@media (max-width:600px){
  #header-bar{flex-wrap:wrap;justify-content:center}
  .modal{padding:16px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>

<header id="header-bar">
  <div class="grupo-esq">
    <a class="voltar" href="../index.html">← Menu</a>
    <a class="voltar" href="cena2.html">← Confeitaria</a>
  </div>
  <span class="cenario">3 · A Câmara Fria</span>
  <span id="cronometro" aria-label="Tempo restante">15:00</span>
</header>

<main id="game-stage">
  <div class="cena" id="cena">
    <img src="../IMG/cenario3.jpg" alt="Câmara fria com geladeiras industriais, porta de metal com teclado de segurança, cartaz com o enigma das densidades e prateleiras com recipientes e um freezer trancado" draggable="false" onerror="this.parentNode.classList.add('sem-imagem')">

    <button class="interactive-node r-esq" id="no-armario" type="button" data-nome="Armário congelado" aria-label="Armário de inox congelado"></button>
    <button class="interactive-node r-meio" id="no-geladeira-esq" type="button" data-nome="Geladeira industrial" aria-label="Geladeira industrial de portas de vidro"></button>
    <button class="interactive-node r-meio" id="no-porta" type="button" data-nome="Porta do freezer" aria-label="Porta de metal do freezer"></button>
    <button class="interactive-node r-baixo" id="no-teclado" type="button" data-nome="Bloqueio de segurança" aria-label="Teclado do bloqueio de segurança"><span class="luz"></span></button>
    <button class="interactive-node r-baixo" id="no-termostato" type="button" data-nome="Painel do termostato" aria-label="Painel do termostato"></button>
    <button class="interactive-node" id="no-geladeira-meio" type="button" data-nome="Geladeira de vidro" aria-label="Geladeira do meio"></button>
    <button class="interactive-node" id="no-caixas-esq" type="button" data-nome="Caixas empilhadas" aria-label="Caixas empilhadas"></button>
    <button class="interactive-node r-baixo" id="no-poster" type="button" data-nome="Cartaz das densidades" aria-label="Cartaz do enigma das densidades"></button>
    <button class="interactive-node r-baixo" id="no-lampada" type="button" data-nome="Lâmpada" aria-label="Lâmpada pendurada"></button>
    <button class="interactive-node r-meio" id="no-gelo" type="button" data-nome="Poças de gelo" aria-label="Poças de gelo no chão"></button>
    <button class="interactive-node r-baixo" id="no-caixas-dir" type="button" data-nome="Caixas congeladas" aria-label="Caixas congeladas no alto da prateleira"></button>
    <button class="interactive-node r-baixo" id="no-pote3a" type="button" data-nome="Recipiente #3" aria-label="Recipiente número 3"></button>
    <button class="interactive-node r-baixo" id="no-pote3b" type="button" data-nome="Recipiente #3" aria-label="Outro recipiente número 3"></button>
    <button class="interactive-node r-baixo r-dir" id="no-pote11" type="button" data-nome="Recipiente #11" aria-label="Recipiente número 11"></button>
    <button class="interactive-node" id="no-potes-med" type="button" data-nome="Recipientes apagados" aria-label="Recipientes com etiquetas apagadas"></button>
    <button class="interactive-node r-dir" id="no-misturador" type="button" data-nome="Painel do misturador" aria-label="Painel do misturador de emulsão"></button>
    <button class="interactive-node r-dir" id="no-caixa" type="button" data-nome="Freezer de frutas raras" aria-label="Freezer de frutas raras, trancado"><span class="luz"></span></button>
    <button class="interactive-node r-dir" id="no-recip-baixo" type="button" data-nome="Recipientes de baixo" aria-label="Recipientes na prateleira de baixo"></button>
  </div>
</main>

<div id="mensagem" aria-live="polite"></div>
<footer id="inventory-bar" aria-label="Inventário"></footer>

<div id="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal-topo">
      <h2 id="modal-titulo"></h2>
      <button id="modal-fechar" type="button" aria-label="Fechar">X</button>
    </div>
    <div id="modal-corpo"></div>
  </div>
</div>

<script>
const CHAVE_ESTADO = 'cozinha_estado';
const DURACAO = 15 * 60;
const SENHA_SEGURANCA = '10';
const SENHA_CAIXA = '6075';
const EMULSAO = { meta: 10, largura: 24, graca: 1 };

const ITENS = {
  chave:       { nome: 'Chave de Fenda de Confeiteiro', icone: '🪛', desc: 'Clique no painel do termostato para abri-lo.' },
  mapa:        { nome: 'Mapa do Restaurante', icone: '🗺️', desc: 'Mostra o caminho entre as cozinhas. Clique de novo para abrir.' },
  baunilha:    { nome: 'Extrato de Baunilha Rara', icone: '🌿', desc: 'Ingrediente obrigatório para a nota máxima no prato final.' },
  termometro:  { nome: 'Termômetro Digital', icone: '🌡️', desc: 'Leve para a Confeitaria e use no frasco de calda.' },
  yuzu:        { nome: 'Fruta de Yuzu Congelada', icone: '🍋', desc: 'Leve para a Confeitaria e deixe descongelar no mármore frio.' },
  merengue:    { nome: 'Merengue Assado', icone: '🍥', desc: 'Assado no ponto exato. Será usado no prato final.' },
  calda:       { nome: 'Calda no Ponto', icone: '🍯', desc: 'Calda de açúcar no ponto de bola mole, 118 °C.' }
};

const PADRAO = {
  fim: Date.now() + DURACAO * 1000,
  inventario: [],
  erros: 0,
  acertos: 0,
  chavePega: false,
  mapaPego: false,
  potesAbertos: false,
  portaAberta: false,
  fornoEtapa: 0,
  assadoEm: 0,
  merengue: false,
  caldaPronta: false,
  yuzuUsado: false,
  termostatoAberto: false,
  caixaAberta: false,
  segurancaAberta: false,
  emulsaoPronta: false
};
function carregarEstado() {
  try { return JSON.parse(sessionStorage.getItem(CHAVE_ESTADO)); } catch (e) { return null; }
}
let estado = Object.assign({}, PADRAO, carregarEstado() || {});
function salvar() {
  try { sessionStorage.setItem(CHAVE_ESTADO, JSON.stringify(estado)); } catch (e) {}
}
salvar();

const $ = s => document.querySelector(s);
const overlay = $('#modal-overlay');
const modalTitulo = $('#modal-titulo');
const modalCorpo = $('#modal-corpo');
let travado = false;
let selecionado = null;
let aoFechar = null;

function fala(texto) { $('#mensagem').textContent = texto; }

function abrirModal(titulo, html) {
  if (aoFechar) { aoFechar(); aoFechar = null; }
  modalTitulo.textContent = titulo;
  modalCorpo.innerHTML = html;
  overlay.hidden = false;
}
function fecharModal() {
  if (travado) return;
  if (aoFechar) { aoFechar(); aoFechar = null; }
  overlay.hidden = true;
  modalCorpo.innerHTML = '';
}
$('#modal-fechar').addEventListener('click', fecharModal);
overlay.addEventListener('click', e => { if (e.target === overlay) fecharModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') fecharModal();
  if ((e.key === 'h' || e.key === 'H') && overlay.hidden) $('#cena').classList.toggle('debug');
});

function renderInventario() {
  const barra = $('#inventory-bar');
  barra.innerHTML = '';
  for (let i = 0; i < 8; i++) {
    const id = estado.inventario[i];
    if (id && ITENS[id]) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'slot cheio' + (selecionado === id ? ' ativo' : '');
      b.title = ITENS[id].nome;
      b.setAttribute('aria-label', ITENS[id].nome);
      b.textContent = ITENS[id].icone;
      b.addEventListener('click', () => clicarItem(id));
      barra.appendChild(b);
    } else {
      const d = document.createElement('div');
      d.className = 'slot';
      barra.appendChild(d);
    }
  }
}
function addItem(id) {
  if (!estado.inventario.includes(id)) estado.inventario.push(id);
  salvar();
  renderInventario();
}
function removerItem(id) {
  estado.inventario = estado.inventario.filter(i => i !== id);
  salvar();
  renderInventario();
}
function clicarItem(id) {
  if (id === 'mapa') {
    selecionado = null;
    renderInventario();
    abrirMapa();
    return;
  }
  if (selecionado === id) {
    selecionado = null;
    fala('Item guardado.');
  } else {
    selecionado = id;
    fala(ITENS[id].nome + ': ' + ITENS[id].desc);
  }
  renderInventario();
}
function ligar(id, alvo, fn, usos) {
  $(id).addEventListener('click', () => {
    if (selecionado) {
      if (usos && usos[selecionado]) { usos[selecionado](); return; }
      fala(ITENS[selecionado].nome + ' não funciona em: ' + alvo + '. Clique no item de novo para guardá-lo.');
      return;
    }
    fn();
  });
}

function abrirMapa() {
  abrirModal('Mapa do Restaurante', `
    <div class="mapa">
      <div class="sala">1 · Despensa</div>
      <div class="sala">2 · Confeitaria e Fornos</div>
      <div class="sala atual">3 · Câmara Fria<br>(você está aqui)</div>
      <div class="sala">4 · Escritório do Chef</div>
      <div class="sala">5 · Pista Principal</div>
    </div>
    <p class="dica-modal">A porta de metal do freezer leva ao Escritório do Chef.</p>
  `);
}

function painelNumerico(titulo, intro, tam, completo, checar, sucesso, dica) {
  let codigo = '';
  abrirModal(titulo, `
    <p>${intro}</p>
    <div class="visor" id="visor">${'-'.repeat(tam)}</div>
    <div class="teclado">
      ${[1,2,3,4,5,6,7,8,9].map(d => `<button type="button" data-n="${d}">${d}</button>`).join('')}
      <button type="button" data-a="limpar">C</button>
      <button type="button" data-n="0">0</button>
      <button type="button" data-a="ok">OK</button>
    </div>
    ${dica ? `<p class="dica-modal">${dica}</p>` : ''}
  `);
  const visor = $('#visor');
  const atualizar = () => { visor.textContent = (codigo + '-'.repeat(tam)).slice(0, tam); };
  modalCorpo.querySelector('.teclado').addEventListener('click', ev => {
    const b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.n !== undefined) {
      if (codigo.length < tam) { codigo += b.dataset.n; atualizar(); }
    } else if (b.dataset.a === 'limpar') {
      codigo = '';
      atualizar();
    } else if (b.dataset.a === 'ok') {
      if (completo ? codigo.length !== tam : codigo.length === 0) return;
      if (checar(codigo)) {
        sucesso();
      } else {
        estado.erros++;
        salvar();
        codigo = '';
        visor.classList.add('erro');
        visor.textContent = 'ERRO';
        setTimeout(() => { visor.classList.remove('erro'); atualizar(); }, 800);
      }
    }
  });
}

function abrirPoster() {
  abrirModal('Enigma das densidades', `
    <div class="papel">
      <p><strong>ENIGMA DAS DENSIDADES · Freezer</strong></p>
      <p>Massa (g) = Volume (mL) × Densidade (g/cm³).<br>Lembre: 1 cm³ = 1 mL.</p>
      <p><strong>Trava do freezer de frutas:</strong> massa do Recipiente #3 e massa do Recipiente #11, em gramas, nessa ordem, com 2 dígitos cada.</p>
      <p><strong>Bloqueio de segurança da porta:</strong> o freezer de conservação marca <strong>14 °F</strong>. Digite em °C, sem o sinal de menos.</p>
      <p>°C = (°F − 32) ÷ 1,8</p>
    </div>
  `);
}

function abrirRecipiente(numero) {
  const dados = numero === 3
    ? { conteudo: 'Calda de yuzu', dens: '1,2', vol: '50' }
    : { conteudo: 'Gelificante', dens: '1,5', vol: '50' };
  abrirModal('Recipiente #' + numero, `
    <div class="papel">
      <p><strong>RECIPIENTE #${numero}</strong></p>
      <p>Conteúdo: ${dados.conteudo}<br>Densidade: ${dados.dens} g/cm³<br>Volume: ${dados.vol} mL</p>
    </div>
    <p class="dica-modal">Massa = volume × densidade.</p>
  `);
}

function abrirSeguranca() {
  if (estado.segurancaAberta) {
    fala('O bloqueio de segurança já está liberado. A luz do teclado está verde.');
    return;
  }
  painelNumerico(
    'Bloqueio de segurança',
    'Digite a temperatura do freezer em °C (o visor mostra 14 °F).',
    3, false,
    c => c === SENHA_SEGURANCA,
    () => {
      estado.segurancaAberta = true;
      estado.acertos++;
      salvar();
      $('#no-teclado').classList.add('aberta');
      fecharModal();
      fala('Bip! A luz do teclado ficou verde. A porta do freezer está liberada.');
    },
    'Dica: o cartaz da parede explica como converter °F em °C.'
  );
}

function abrirCaixa() {
  if (estado.caixaAberta) {
    fala('O freezer de frutas está vazio. Você já pegou o yuzu.');
    return;
  }
  painelNumerico(
    'Freezer de frutas raras',
    'Trava de balança de precisão. Digite 4 dígitos: a massa (g) do Recipiente #3 e a do Recipiente #11.',
    4, true,
    c => c === SENHA_CAIXA,
    () => {
      estado.caixaAberta = true;
      estado.acertos++;
      salvar();
      addItem('yuzu');
      $('#no-caixa').classList.add('aberta');
      fecharModal();
      fala('Clique! O freezer abriu e você pegou a Fruta de Yuzu Congelada. Ela precisa descongelar na Confeitaria.');
    },
    'Dica: leia as etiquetas dos recipientes e use a fórmula do cartaz.'
  );
}

function abrirMisturador() {
  if (estado.emulsaoPronta) {
    fala('O creme já está em emulsão perfeita, guardado para o prato final.');
    return;
  }
  selecionado = null;
  renderInventario();
  abrirModal('Misturador de emulsão', `
    <p>Mantenha o indicador dentro da zona verde por <strong>${EMULSAO.meta} segundos</strong> sem deixar o creme cortar.</p>
    <div class="trilho" id="trilho">
      <div class="zona-em" id="zona-em"></div>
      <div class="marca" id="marca"></div>
    </div>
    <div class="progresso"><div class="progresso-barra" id="prog"></div></div>
    <div class="leitura" id="leitura-em">0.0 / ${EMULSAO.meta} s</div>
    <button type="button" class="btn-pixel" id="comecar">COMEÇAR</button>
    <p class="dica-modal" id="em-msg">Mova o mouse (ou o dedo) sobre a barra. Também funciona com as setas ← e →.</p>
  `);
  const trilho = $('#trilho');
  const zonaEl = $('#zona-em');
  const marca = $('#marca');
  const prog = $('#prog');
  const leit = $('#leitura-em');
  const msg = $('#em-msg');
  const btn = $('#comecar');
  let pos = 50, centro = 50, dentro = 0, fora = 0, raf = 0, ultimo = 0, t0 = 0;

  const desenhar = () => {
    zonaEl.style.left = (centro - EMULSAO.largura / 2) + '%';
    zonaEl.style.width = EMULSAO.largura + '%';
    marca.style.left = pos + '%';
    prog.style.width = Math.min(100, (dentro / EMULSAO.meta) * 100) + '%';
    leit.textContent = Math.min(dentro, EMULSAO.meta).toFixed(1) + ' / ' + EMULSAO.meta + ' s';
  };
  const moverPara = x => {
    const r = trilho.getBoundingClientRect();
    pos = Math.max(0, Math.min(100, ((x - r.left) / r.width) * 100));
  };
  trilho.addEventListener('pointermove', e => moverPara(e.clientX));
  trilho.addEventListener('pointerdown', e => moverPara(e.clientX));
  const teclas = e => {
    if (e.key === 'ArrowLeft') { pos = Math.max(0, pos - 4); e.preventDefault(); }
    if (e.key === 'ArrowRight') { pos = Math.min(100, pos + 4); e.preventDefault(); }
  };
  document.addEventListener('keydown', teclas);
  aoFechar = () => {
    cancelAnimationFrame(raf);
    document.removeEventListener('keydown', teclas);
  };

  const quadro = agora => {
    const dt = Math.min(0.1, (agora - ultimo) / 1000);
    ultimo = agora;
    const t = (agora - t0) / 1000;
    centro = 50 + 30 * Math.sin(t * 0.8) + 8 * Math.sin(t * 2.1);
    centro = Math.max(EMULSAO.largura / 2, Math.min(100 - EMULSAO.largura / 2, centro));
    if (Math.abs(pos - centro) <= EMULSAO.largura / 2) {
      dentro += dt;
      fora = 0;
    } else {
      fora += dt;
    }
    desenhar();
    if (dentro >= EMULSAO.meta) {
      estado.emulsaoPronta = true;
      estado.acertos++;
      salvar();
      fecharModal();
      fala('Perfeito! A emulsão ficou lisa e brilhante, sem cortar. O creme está pronto para o prato final.');
      return;
    }
    if (fora > EMULSAO.graca) {
      estado.erros++;
      salvar();
      msg.textContent = 'O creme cortou! Fique dentro da zona verde. Tente de novo.';
      btn.textContent = 'TENTAR DE NOVO';
      btn.hidden = false;
      return;
    }
    raf = requestAnimationFrame(quadro);
  };
  btn.addEventListener('click', () => {
    dentro = 0;
    fora = 0;
    btn.hidden = true;
    msg.textContent = 'Siga a zona verde com o indicador vermelho!';
    t0 = performance.now();
    ultimo = t0;
    raf = requestAnimationFrame(quadro);
  });
  desenhar();
}

function usarChaveNoTermostato() {
  if (estado.termostatoAberto) {
    fala('O painel já está aberto.');
    return;
  }
  estado.termostatoAberto = true;
  salvar();
  removerItem('chave');
  selecionado = null;
  addItem('termometro');
  renderInventario();
  fala('Você soltou os parafusos e achou um Termômetro Digital escondido atrás do painel. Leve-o para a Confeitaria.');
}
function abrirTermostato() {
  if (estado.termostatoAberto) {
    fala('O painel do termostato está aberto e vazio.');
  } else if (estado.inventario.includes('chave')) {
    usarChaveNoTermostato();
  } else {
    fala('Um painel de termostato preso por parafusos. Falta uma ferramenta para abrir. A chave de fenda está na Despensa.');
  }
}

function abrirPorta() {
  if (!estado.segurancaAberta) {
    abrirSeguranca();
    return;
  }
  const falta = [];
  if (!estado.caldaPronta) falta.push('a calda no ponto (use o termômetro no frasco da Confeitaria)');
  if (!estado.yuzuUsado) falta.push('o yuzu descongelando no mármore da Confeitaria');
  if (falta.length) {
    abrirModal('Porta do freezer', `
      <div class="papel">
        <p>Um bilhete do Chef está preso na porta:</p>
        <p>"Só passa quem já preparou tudo na Confeitaria."</p>
        <p>Ainda falta: ${falta.join(' e ')}.</p>
      </div>
      <a class="btn-pixel" href="cena2.html">← Voltar à Confeitaria</a>
    `);
    return;
  }
  abrirModal('Escritório do Chef', `
    <p>A porta do freezer se abre e um corredor leva ao Escritório do Chef Executivo.</p>
    <a class="btn-pixel" href="cena4.html">Entrar →</a>
  `);
}

ligar('#no-poster', 'Cartaz', abrirPoster);
ligar('#no-pote3a', 'Recipiente', () => abrirRecipiente(3));
ligar('#no-pote3b', 'Recipiente', () => abrirRecipiente(3));
ligar('#no-pote11', 'Recipiente', () => abrirRecipiente(11));
ligar('#no-teclado', 'Teclado', abrirSeguranca);
ligar('#no-porta', 'Porta', abrirPorta);
ligar('#no-caixa', 'Freezer', abrirCaixa);
ligar('#no-misturador', 'Misturador', abrirMisturador);
ligar('#no-termostato', 'Termostato', abrirTermostato, { chave: usarChaveNoTermostato });

ligar('#no-armario', 'Armário', () => fala('Um armário de inox lacrado pelo gelo. Não abre.'));
ligar('#no-geladeira-esq', 'Geladeira', () => fala('Uma geladeira industrial cheia de caixas. A porta está congelada e não abre.'));
ligar('#no-geladeira-meio', 'Geladeira', () => fala('Uma geladeira de vidro com caixas de leite e manteiga. Nada de útil.'));
ligar('#no-caixas-esq', 'Caixas', () => fala('Caixas de papelão duras de tanto gelo.'));
ligar('#no-caixas-dir', 'Caixas', () => fala('Caixas congeladas no alto da prateleira. Nada de útil.'));
ligar('#no-lampada', 'Lâmpada', () => fala('A luz azulada da lâmpada deixa a sala ainda mais fria.'));
ligar('#no-gelo', 'Gelo', () => fala('Poças de gelo no chão. Melhor andar devagar.'));
ligar('#no-potes-med', 'Recipientes', () => fala('As etiquetas destes recipientes estão apagadas pelo gelo. Os legíveis estão na prateleira de cima.'));
ligar('#no-recip-baixo', 'Recipientes', () => fala('Recipientes 011 e 012, com as etiquetas cobertas de gelo. Não dá para ler.'));

function formatar(seg) {
  const m = String(Math.floor(seg / 60)).padStart(2, '0');
  const s = String(seg % 60).padStart(2, '0');
  return m + ':' + s;
}
function fimDeJogo() {
  clearInterval(relogio);
  travado = true;
  try { sessionStorage.removeItem(CHAVE_ESTADO); } catch (e) {}
  abrirModal('FORA DO TEMPO!', `
    <p>O concurso começou sem você. O Chef abre a porta, furioso, e você está demitido antes de tocar na bancada.</p>
    <a class="btn-pixel" href="../index.html">Voltar ao menu</a>
  `);
}
function tick() {
  const restante = Math.max(0, Math.ceil((estado.fim - Date.now()) / 1000));
  const cron = $('#cronometro');
  cron.textContent = formatar(restante);
  cron.classList.toggle('urgente', restante <= 60);
  if (restante <= 0) fimDeJogo();
}
const relogio = setInterval(tick, 1000);

if (estado.caixaAberta) $('#no-caixa').classList.add('aberta');
if (estado.segurancaAberta) $('#no-teclado').classList.add('aberta');
renderInventario();
tick();
fala('Câmara Fria. Procure o termômetro digital e abra o freezer das frutas raras.');
</script>
</body>
