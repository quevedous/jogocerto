<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cenário 2 · A Estação de Confeitaria</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

:root{
  --escuro:#1a110d;
  --madeira:#4a3428;
  --madeira-escura:#2C221E;
  --papel:#FDF6E2;
  --tinta:#2C221E;
  --tomate:#D9534F;
  --latao:#E6B800;
  --suave:#7a6652;
  --titulo:'Press Start 2P',monospace;
  --texto:'VT323',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
html,body{height:100%}
body{
  display:grid;
  grid-template-rows:auto 1fr auto auto;
  height:100vh;
  overflow:hidden;
  background-color:var(--escuro);
  color:var(--papel);
  font-family:var(--texto);
  font-size:1.4rem;
  line-height:1.3;
  image-rendering:pixelated;
}
:focus-visible{outline:4px solid var(--latao);outline-offset:4px}

#header-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:12px 20px;
  background:var(--escuro);
  border-bottom:4px solid var(--latao);
}
.voltar{
  display:inline-block;
  padding:10px 14px;
  background:var(--madeira-escura);
  border:4px solid var(--latao);
  color:var(--latao);
  text-decoration:none;
  font-family:var(--titulo);
  font-size:.65rem;
  line-height:1.4;
  box-shadow:4px 4px 0 0 rgba(0,0,0,.6);
}
.voltar:hover{background:var(--latao);color:var(--escuro)}
#header-bar .cenario{font-family:var(--titulo);font-size:.7rem;line-height:1.6;text-align:center}
#cronometro{
  font-family:var(--titulo);
  font-size:1rem;
  color:var(--latao);
  background:var(--madeira-escura);
  border:4px solid var(--latao);
  padding:8px 12px;
}
#cronometro.urgente{color:var(--tomate);border-color:var(--tomate)}

#game-stage{display:grid;place-items:center;padding:12px;min-height:0;background:#0d0806}
.cena{
  position:relative;
  width:min(100%,calc((100vh - 250px)*1.8333));
  aspect-ratio:1408/768;
  background:var(--madeira-escura);
  border:6px solid var(--escuro);
  box-shadow:0 0 0 4px var(--latao),12px 12px 0 4px rgba(0,0,0,.6);
}
.cena img{display:block;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;user-select:none;-webkit-user-drag:none}
.cena.sem-imagem img{display:none}
.cena.sem-imagem::before{
  content:"Salve a imagem do cenário em IMG/cenario2.jpg";
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  padding:20px;
  text-align:center;
  font-size:1.6rem;
}

.interactive-node{
  position:absolute;
  display:block;
  z-index:2;
}
.interactive-node::after{
  content:attr(data-nome);
  position:absolute;
  left:50%;
  bottom:calc(100% + 8px);
  transform:translateX(-50%);
  white-space:nowrap;
  background:var(--escuro);
  color:var(--papel);
  border:3px solid var(--latao);
  padding:2px 10px;
  font-family:var(--texto);
  font-size:1.2rem;
  opacity:0;
  pointer-events:none;
  z-index:5;
}
.interactive-node.r-baixo::after{bottom:auto;top:calc(100% + 8px)}
.interactive-node.r-esq::after{left:0;transform:none}
.interactive-node.r-dir::after{left:auto;right:0;transform:none}
.interactive-node.r-meio::after{bottom:auto;top:14px;left:14px;transform:none}
.interactive-node:hover,.interactive-node:focus-visible{
  z-index:4;
  background:rgba(255,255,255,.22);
  outline:none;
}
.interactive-node:hover::after,.interactive-node:focus-visible::after{opacity:1}
.cena.debug .interactive-node{background:rgba(0,255,120,.18);outline:2px solid #00ff78}
.cena.debug .interactive-node::after{opacity:1}

#no-janela{left:34.6%;top:8.5%;width:18%;height:30.6%}
#no-frasco{left:31.2%;top:21.5%;width:17.8%;height:35.2%}
#no-extrato{left:26.6%;top:23.8%;width:3.9%;height:12.6%}
#no-yuzu{left:17.6%;top:45.8%;width:6.2%;height:16.9%}
#no-barril{left:30.2%;top:59.6%;width:10.4%;height:27%}
#no-caixote{left:15.6%;top:69.7%;width:12.2%;height:20.2%}
#no-marmore{left:34.2%;top:69.5%;width:37.8%;height:29%}
#no-potes-meio{left:38.4%;top:43.6%;width:19.5%;height:13%}
#no-prateleira{left:56.8%;top:19.3%;width:16.3%;height:13.3%}
#no-panelas{left:59.7%;top:41.7%;width:12.4%;height:15%}
#no-poster{left:73.9%;top:13.7%;width:8%;height:31.9%}
#no-calda{left:72.1%;top:37.1%;width:6.9%;height:28.3%}
#no-bicos{left:39.4%;top:63.5%;width:10%;height:12.6%}
#no-batedeira{left:52.9%;top:52.7%;width:10.3%;height:21.5%}
#no-receita{left:35.7%;top:78.5%;width:7.7%;height:10%}
#no-tabela{left:41%;top:76.4%;width:16.1%;height:15.4%}
#no-prancheta{left:57.7%;top:76.8%;width:10.9%;height:14.3%}
#no-forno{left:86.3%;top:14%;width:13.7%;height:19%}
#no-forno2{left:86.3%;top:33.5%;width:13.7%;height:17%}
#no-forno3{left:86.3%;top:50.5%;width:13.7%;height:16.5%}
#no-forno4{left:86.3%;top:67%;width:13.7%;height:25%}
#no-porta{left:0;top:0;width:15.3%;height:96.4%}

.luz{
  display:none;
  position:absolute;
  inset:0;
  background:rgba(255,150,40,.4);
  mix-blend-mode:screen;
  box-shadow:0 0 36px 12px rgba(255,140,30,.6);
  pointer-events:none;
}
#no-forno.ligado .luz{display:block}
#no-forno.pronto .luz{display:block;background:rgba(60,230,110,.45);box-shadow:0 0 36px 12px rgba(60,230,110,.7)}

#mensagem{
  min-height:3.2rem;
  padding:8px 20px;
  background:var(--madeira-escura);
  border-top:4px solid var(--latao);
  font-size:1.5rem;
}
#inventory-bar{
  display:flex;
  gap:12px;
  padding:10px 20px;
  background:var(--escuro);
  border-top:4px solid var(--latao);
  overflow-x:auto;
}
.slot{
  flex:0 0 64px;
  height:64px;
  display:grid;
  place-items:center;
  font-size:2rem;
  border:4px dashed var(--suave);
  background:var(--madeira);
  box-shadow:inset 4px 4px 0 0 rgba(0,0,0,.35);
}
.slot.cheio{border-style:solid;border-color:var(--latao);background:var(--madeira-escura);cursor:pointer}
.slot.ativo{background:var(--latao);transform:translate(-3px,-3px);box-shadow:5px 5px 0 0 var(--escuro)}

#modal-overlay{
  position:fixed;
  inset:0;
  z-index:20;
  display:grid;
  place-items:center;
  padding:16px;
  background:rgba(10,6,4,.82);
}
.modal{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  padding:24px;
  background:var(--papel);
  color:var(--tinta);
  border:4px solid var(--escuro);
  border-left:16px solid var(--tomate);
  box-shadow:12px 12px 0 0 rgba(0,0,0,.6);
}
.modal-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
#modal-titulo{font-family:var(--titulo);font-weight:400;font-size:.85rem;line-height:1.7}
#modal-fechar{
  flex:0 0 auto;
  width:36px;height:36px;
  background:var(--tomate);
  color:var(--papel);
  border:4px solid var(--escuro);
  font-family:var(--titulo);
  font-size:.8rem;
}
.modal p{font-size:1.5rem;margin-bottom:10px}
.papel{
  padding:16px;
  background:#fffbe9;
  border:3px dashed var(--suave);
  font-size:1.5rem;
}
.papel p+p{margin-top:10px}
.dica-modal{color:var(--suave);margin-top:12px}

.tabela-conv{width:100%;border-collapse:collapse;margin:10px 0;font-size:1.5rem;text-align:center}
.tabela-conv th,.tabela-conv td{border:3px solid var(--escuro);padding:6px}
.tabela-conv th{background:var(--latao);font-family:var(--titulo);font-size:.7rem;font-weight:400}

.display-forno{
  margin-bottom:14px;
  padding:12px 14px;
  background:#1b1208;
  color:#ff9a2e;
  border:4px solid var(--escuro);
  font-size:1.5rem;
  line-height:1.4;
}
.visor{
  margin-bottom:14px;
  padding:16px;
  background:#0b1a0f;
  color:#4cff7a;
  border:4px solid var(--escuro);
  font-family:var(--titulo);
  font-size:1.5rem;
  letter-spacing:.4em;
  text-align:center;
}
.visor.erro{color:#ff5a4f}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.teclado button{
  padding:14px;
  background:var(--madeira-escura);
  color:var(--papel);
  border:4px solid var(--escuro);
  box-shadow:4px 4px 0 0 var(--escuro);
  font-family:var(--titulo);
  font-size:1rem;
}
.teclado button:hover{background:var(--latao);color:var(--escuro)}
.teclado button:active{transform:translate(4px,4px);box-shadow:none}

.termo{
  position:relative;
  height:44px;
  margin:16px 0 10px;
  background:linear-gradient(90deg,#4a90d9,#e6b800,#d9534f);
  border:4px solid var(--escuro);
}
.zona{
  position:absolute;
  top:0;bottom:0;
  background:rgba(50,190,95,.9);
  border-left:4px solid var(--escuro);
  border-right:4px solid var(--escuro);
}
.agulha{
  position:absolute;
  top:-12px;bottom:-12px;
  left:0;
  width:6px;
  margin-left:-3px;
  background:var(--escuro);
}
.leitura{font-family:var(--titulo);font-size:1rem;text-align:center;margin-bottom:4px}

.btn-pixel{
  display:inline-block;
  margin-top:14px;
  padding:14px 18px;
  background:var(--tomate);
  color:var(--papel);
  border:4px solid var(--escuro);
  box-shadow:6px 6px 0 0 var(--escuro);
  font-family:var(--titulo);
  font-size:.7rem;
  line-height:1.4;
  text-decoration:none;
  cursor:pointer;
}
.btn-pixel:hover{background:var(--latao);color:var(--escuro)}
.btn-pixel:active{transform:translate(4px,4px);box-shadow:none}

.mapa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sala{
  padding:12px 6px;
  background:#f3e7c4;
  border:4px solid var(--escuro);
  font-size:1.25rem;
  text-align:center;
}
.sala.atual{background:var(--latao)}

@media (max-width:600px){
  #header-bar{flex-wrap:wrap;justify-content:center}
  .modal{padding:16px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>

<header id="header-bar">
  <a class="voltar" href="../index.html">← Menu</a>
  <span class="cenario">2 · A Estação de Confeitaria</span>
  <span id="cronometro" aria-label="Tempo restante">15:00</span>
</header>

<main id="game-stage">
  <div class="cena" id="cena">
    <img src="../IMG/cenario2.jpg" alt="Estação de confeitaria com porta de madeira à esquerda, janela com grades, alambique, mesa de mármore com batedeira e papéis, e quatro fornos digitais à direita" draggable="false" onerror="this.parentNode.classList.add('sem-imagem')">

    <button class="interactive-node r-baixo" id="no-janela" type="button" data-nome="Janela" aria-label="Janela com grades"></button>
    <button class="interactive-node" id="no-frasco" type="button" data-nome="Alambique de vidro" aria-label="Alambique de vidro"></button>
    <button class="interactive-node" id="no-extrato" type="button" data-nome="Extrato de merengue" aria-label="Garrafa de extrato de merengue"></button>
    <button class="interactive-node" id="no-yuzu" type="button" data-nome="Pote de yuzu" aria-label="Pote com etiqueta Yuzu Congelada"></button>
    <button class="interactive-node" id="no-barril" type="button" data-nome="Barril de metal" aria-label="Barril de metal"></button>
    <button class="interactive-node" id="no-caixote" type="button" data-nome="Caixote com potes" aria-label="Caixote com potes de barro"></button>
    <button class="interactive-node r-meio" id="no-marmore" type="button" data-nome="Bancada de mármore" aria-label="Bancada de mármore"></button>
    <button class="interactive-node" id="no-potes-meio" type="button" data-nome="Potes de ingredientes" aria-label="Potes de farinha, açúcar e temperos"></button>
    <button class="interactive-node" id="no-prateleira" type="button" data-nome="Prateleira de ingredientes" aria-label="Prateleira de ingredientes"></button>
    <button class="interactive-node" id="no-panelas" type="button" data-nome="Panelas" aria-label="Panelas empilhadas"></button>
    <button class="interactive-node" id="no-poster" type="button" data-nome="Cartaz do merengue" aria-label="Cartaz do merengue na parede"></button>
    <button class="interactive-node" id="no-calda" type="button" data-nome="Frasco de calda" aria-label="Frasco de calda sobre o fogareiro"></button>
    <button class="interactive-node" id="no-bicos" type="button" data-nome="Bicos de confeitar" aria-label="Bicos de confeitar"></button>
    <button class="interactive-node" id="no-batedeira" type="button" data-nome="Batedeira industrial" aria-label="Batedeira industrial"></button>
    <button class="interactive-node" id="no-receita" type="button" data-nome="Receita" aria-label="Papel de receitas"></button>
    <button class="interactive-node" id="no-tabela" type="button" data-nome="Pistas de conversão" aria-label="Papel de pistas de conversão de temperatura"></button>
    <button class="interactive-node" id="no-prancheta" type="button" data-nome="Prancheta do Chef" aria-label="Prancheta do Chef"></button>
    <button class="interactive-node r-dir" id="no-forno" type="button" data-nome="Forno do merengue" aria-label="Forno de cima, com o merengue"><span class="luz"></span></button>
    <button class="interactive-node r-dir" id="no-forno2" type="button" data-nome="Forno" aria-label="Segundo forno"></button>
    <button class="interactive-node r-dir" id="no-forno3" type="button" data-nome="Forno" aria-label="Terceiro forno"></button>
    <button class="interactive-node r-dir" id="no-forno4" type="button" data-nome="Forno" aria-label="Quarto forno"></button>
    <button class="interactive-node r-meio" id="no-porta" type="button" data-nome="Porta da Câmara Fria" aria-label="Porta da Câmara Fria"></button>
  </div>
</main>

<div id="mensagem" aria-live="polite"></div>
<footer id="inventory-bar" aria-label="Inventário"></footer>

<div id="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal-topo">
      <h2 id="modal-titulo"></h2>
      <button id="modal-fechar" type="button" aria-label="Fechar">X</button>
    </div>
    <div id="modal-corpo"></div>
  </div>
</div>

<script>
const CHAVE_ESTADO = 'cozinha_estado';
const DURACAO = 15 * 60;
const TEMPO_ESTAGIO = 5000;
const ESTAGIOS = {
  1: { f: '176', c: 80, nome: 'secar' },
  2: { f: '--', c: 121, nome: 'dourar' }
};
const CALDA = { min: 100, max: 140, alvo: 118, tol: 3, vel: 28 };

const ITENS = {
  chave:       { nome: 'Chave de Fenda de Confeiteiro', icone: '🪛', desc: 'Vai servir para abrir um painel na Câmara Fria.' },
  mapa:        { nome: 'Mapa do Restaurante', icone: '🗺️', desc: 'Mostra o caminho entre as cozinhas. Clique de novo para abrir.' },
  baunilha:    { nome: 'Extrato de Baunilha Rara', icone: '🌿', desc: 'Ingrediente obrigatório para a nota máxima no prato final.' },
  termometro:  { nome: 'Termômetro Digital', icone: '🌡️', desc: 'Selecione e clique no frasco de calda para medir o ponto.' },
  yuzu:        { nome: 'Fruta de Yuzu Congelada', icone: '🍋', desc: 'Precisa descongelar aos poucos. O mármore frio ajuda.' },
  merengue:    { nome: 'Merengue Assado', icone: '🍥', desc: 'Assado no ponto exato. Será usado no prato final.' },
  calda:       { nome: 'Calda no Ponto', icone: '🍯', desc: 'Calda de açúcar no ponto de bola mole, 118 °C.' }
};

const PADRAO = {
  fim: Date.now() + DURACAO * 1000,
  inventario: [],
  erros: 0,
  acertos: 0,
  chavePega: false,
  mapaPego: false,
  potesAbertos: false,
  portaAberta: false,
  fornoEtapa: 0,
  assadoEm: 0,
  merengue: false,
  caldaPronta: false,
  yuzuUsado: false
};
function carregarEstado() {
  try { return JSON.parse(sessionStorage.getItem(CHAVE_ESTADO)); } catch (e) { return null; }
}
let estado = Object.assign({}, PADRAO, carregarEstado() || {});
function salvar() {
  try { sessionStorage.setItem(CHAVE_ESTADO, JSON.stringify(estado)); } catch (e) {}
}
salvar();

const $ = s => document.querySelector(s);
const overlay = $('#modal-overlay');
const modalTitulo = $('#modal-titulo');
const modalCorpo = $('#modal-corpo');
let travado = false;
let selecionado = null;
let aoFechar = null;

function fala(texto) { $('#mensagem').textContent = texto; }

function abrirModal(titulo, html) {
  if (aoFechar) { aoFechar(); aoFechar = null; }
  modalTitulo.textContent = titulo;
  modalCorpo.innerHTML = html;
  overlay.hidden = false;
}
function fecharModal() {
  if (travado) return;
  if (aoFechar) { aoFechar(); aoFechar = null; }
  overlay.hidden = true;
  modalCorpo.innerHTML = '';
}
$('#modal-fechar').addEventListener('click', fecharModal);
overlay.addEventListener('click', e => { if (e.target === overlay) fecharModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') fecharModal();
  if ((e.key === 'h' || e.key === 'H') && overlay.hidden) $('#cena').classList.toggle('debug');
});

function renderInventario() {
  const barra = $('#inventory-bar');
  barra.innerHTML = '';
  for (let i = 0; i < 8; i++) {
    const id = estado.inventario[i];
    if (id && ITENS[id]) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'slot cheio' + (selecionado === id ? ' ativo' : '');
      b.title = ITENS[id].nome;
      b.setAttribute('aria-label', ITENS[id].nome);
      b.textContent = ITENS[id].icone;
      b.addEventListener('click', () => clicarItem(id));
      barra.appendChild(b);
    } else {
      const d = document.createElement('div');
      d.className = 'slot';
      barra.appendChild(d);
    }
  }
}
function addItem(id) {
  if (!estado.inventario.includes(id)) estado.inventario.push(id);
  salvar();
  renderInventario();
}
function removerItem(id) {
  estado.inventario = estado.inventario.filter(i => i !== id);
  salvar();
  renderInventario();
}
function clicarItem(id) {
  if (id === 'mapa') {
    selecionado = null;
    renderInventario();
    abrirMapa();
    return;
  }
  if (selecionado === id) {
    selecionado = null;
    fala('Item guardado.');
  } else {
    selecionado = id;
    fala(ITENS[id].nome + ': ' + ITENS[id].desc);
  }
  renderInventario();
}
function ligar(id, alvo, fn, usos) {
  $(id).addEventListener('click', () => {
    if (selecionado) {
      if (usos && usos[selecionado]) { usos[selecionado](); return; }
      fala(ITENS[selecionado].nome + ' não funciona em: ' + alvo + '. Clique no item de novo para guardá-lo.');
      return;
    }
    fn();
  });
}

function abrirMapa() {
  abrirModal('Mapa do Restaurante', `
    <div class="mapa">
      <div class="sala">1 · Despensa</div>
      <div class="sala atual">2 · Confeitaria e Fornos<br>(você está aqui)</div>
      <div class="sala">3 · Câmara Fria</div>
      <div class="sala">4 · Escritório do Chef</div>
      <div class="sala">5 · Pista Principal</div>
    </div>
    <p class="dica-modal">A porta de madeira à esquerda leva à Câmara Fria.</p>
  `);
}

function abrirReceita() {
  abrirModal('Papel de receitas', `
    <div class="papel">
      <p><strong>Merengue Suíço da Casa</strong></p>
      <p>4 claras, 220 g de açúcar e uma pitada de sal. Bater em banho-maria até firmar.</p>
      <p><strong>Estágio 1 (secar):</strong> forno baixo. O visor do forno já mostra a temperatura em °F.</p>
      <p><strong>Estágio 2 (dourar):</strong> a temperatura está no cartaz da parede.</p>
      <p>"Atenção, estagiário: os fornos novos só aceitam graus Celsius!"</p>
    </div>
  `);
}

function abrirPoster() {
  abrirModal('Cartaz do merengue', `
    <div class="papel">
      <p><strong>MERENGUE · Ponto e conversão</strong></p>
      <p>O merengue perfeito é assado em dois estágios.</p>
      <p><strong>1º Secar:</strong> temperatura no visor do forno.</p>
      <p><strong>2º Dourar:</strong> 250 °F.</p>
    </div>
  `);
}

function abrirTabela() {
  abrirModal('Pistas de conversão', `
    <div class="papel">
      <p><strong>Pistas de conversão de temperatura</strong></p>
      <p>F = (9/5) × C + 32</p>
      <p>Para ir de °F para °C: C = (F − 32) ÷ 1,8</p>
      <table class="tabela-conv">
        <tr><th>°F</th><th>°C</th></tr>
        <tr><td>32</td><td>0</td></tr>
        <tr><td>122</td><td>50</td></tr>
        <tr><td>212</td><td>100</td></tr>
      </table>
    </div>
  `);
}

function abrirPrancheta() {
  abrirModal('Prancheta do Chef', `
    <div class="papel">
      <p><strong>Erros de estagiários</strong></p>
      <p>1) Misturou °F com °C e queimou 3 bandejas de merengue.</p>
      <p>2) Digitou a temperatura com casas decimais e o forno travou.</p>
      <p>"Sempre arredonde para o número inteiro mais próximo antes de digitar!"</p>
    </div>
  `);
}

function abrirPainel(n) {
  const e = ESTAGIOS[n];
  let codigo = '';
  abrirModal('Painel térmico · Estágio ' + n, `
    <div class="display-forno">
      FORNOS CONFEITARIA<br>
      ESTÁGIO ${n}<br>
      TEMP °F: ${e.f} → °C: ?
    </div>
    <p>Digite a temperatura em °C (até 3 dígitos).</p>
    <div class="visor" id="visor">---</div>
    <div class="teclado">
      ${[1,2,3,4,5,6,7,8,9].map(d => `<button type="button" data-n="${d}">${d}</button>`).join('')}
      <button type="button" data-a="limpar">C</button>
      <button type="button" data-n="0">0</button>
      <button type="button" data-a="ok">OK</button>
    </div>
    ${n === 2 ? '<p class="dica-modal">O visor não mostra a temperatura em °F deste estágio. Procure no cenário.</p>' : ''}
  `);
  const visor = $('#visor');
  const atualizar = () => { visor.textContent = (codigo + '---').slice(0, 3); };
  modalCorpo.querySelector('.teclado').addEventListener('click', ev => {
    const b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.n !== undefined) {
      if (codigo.length < 3) { codigo += b.dataset.n; atualizar(); }
    } else if (b.dataset.a === 'limpar') {
      codigo = '';
      atualizar();
    } else if (b.dataset.a === 'ok' && codigo.length > 0) {
      if (Number(codigo) === e.c) {
        estado.fornoEtapa = n === 1 ? 1 : 3;
        estado.assadoEm = Date.now() + TEMPO_ESTAGIO;
        estado.acertos++;
        salvar();
        atualizarForno();
        fecharModal();
        fala(n === 1
          ? 'Bip! O forno ajustou para ' + e.c + ' °C. Estágio 1 em andamento, o merengue está secando.'
          : 'Bip! O forno ajustou para ' + e.c + ' °C. Estágio 2 em andamento, o merengue está dourando.');
      } else {
        estado.erros++;
        salvar();
        codigo = '';
        visor.classList.add('erro');
        visor.textContent = 'ERRO';
        setTimeout(() => { visor.classList.remove('erro'); atualizar(); }, 800);
      }
    }
  });
}

function abrirForno() {
  const et = estado.fornoEtapa;
  if (et === 0) { abrirPainel(1); return; }
  if (et === 2) { abrirPainel(2); return; }
  if (et === 1 || et === 3) {
    const s = Math.max(1, Math.ceil((estado.assadoEm - Date.now()) / 1000));
    fala('O merengue ainda está no forno. Faltam cerca de ' + s + ' segundos.');
    return;
  }
  if (et === 4) {
    estado.merengue = true;
    estado.fornoEtapa = 5;
    salvar();
    addItem('merengue');
    atualizarForno();
    fala('Você tirou o merengue do forno, dourado e firme. Agora a porta da Câmara Fria vai abrir.');
    return;
  }
  fala('O forno está vazio. O merengue já está com você.');
}

function atualizarForno() {
  const f = $('#no-forno');
  const agora = Date.now();
  if (estado.fornoEtapa === 1 && agora >= estado.assadoEm) {
    estado.fornoEtapa = 2;
    salvar();
    fala('Ding! Estágio 1 concluído. O visor pede a temperatura do estágio 2. Clique no forno.');
  } else if (estado.fornoEtapa === 3 && agora >= estado.assadoEm) {
    estado.fornoEtapa = 4;
    salvar();
    fala('Ding! O merengue está dourado e pronto. Clique no forno para retirá-lo.');
  }
  f.classList.toggle('ligado', estado.fornoEtapa === 1 || estado.fornoEtapa === 3);
  f.classList.toggle('pronto', estado.fornoEtapa === 2 || estado.fornoEtapa === 4);
}

function abrirCalda() {
  if (estado.caldaPronta) {
    fala('A calda já está no ponto. Guarde-a para o prato final.');
    return;
  }
  selecionado = null;
  renderInventario();
  const span = CALDA.max - CALDA.min;
  const zonaEsq = ((CALDA.alvo - CALDA.tol - CALDA.min) / span) * 100;
  const zonaLarg = ((2 * CALDA.tol) / span) * 100;
  abrirModal('Ponto da calda', `
    <p>Pare o termômetro no <strong>Ponto de Bola Mole: ${CALDA.alvo} °C</strong>.</p>
    <div class="termo">
      <div class="zona" style="left:${zonaEsq}%;width:${zonaLarg}%"></div>
      <div class="agulha" id="agulha"></div>
    </div>
    <div class="leitura" id="leitura">${CALDA.min.toFixed(1)} °C</div>
    <button type="button" class="btn-pixel" id="parar">PARAR</button>
    <p class="dica-modal" id="calda-msg">Clique em PARAR quando a agulha estiver na faixa verde.</p>
  `);
  const agulha = $('#agulha');
  const leitura = $('#leitura');
  let temp = CALDA.min;
  const t0 = performance.now();
  let raf = 0;
  const quadro = agora => {
    const d = ((agora - t0) / 1000) * CALDA.vel;
    const m = d % (2 * span);
    temp = CALDA.min + (m <= span ? m : 2 * span - m);
    agulha.style.left = (((temp - CALDA.min) / span) * 100) + '%';
    leitura.textContent = temp.toFixed(1) + ' °C';
    raf = requestAnimationFrame(quadro);
  };
  raf = requestAnimationFrame(quadro);
  aoFechar = () => cancelAnimationFrame(raf);

  $('#parar').addEventListener('click', () => {
    if (Math.abs(temp - CALDA.alvo) <= CALDA.tol) {
      estado.caldaPronta = true;
      estado.acertos++;
      salvar();
      addItem('calda');
      fecharModal();
      fala('Perfeito! A calda parou em ' + temp.toFixed(1) + ' °C, no ponto de bola mole. Você guardou um pouco.');
    } else {
      estado.erros++;
      salvar();
      $('#calda-msg').textContent = temp < CALDA.alvo
        ? 'Cedo demais: a calda ainda está rala (' + temp.toFixed(1) + ' °C). Tente de novo.'
        : 'Passou do ponto (' + temp.toFixed(1) + ' °C). Tente de novo.';
    }
  });
}

function abrirPorta() {
  if (!estado.merengue) {
    fala('A porta da Câmara Fria está travada. Um aviso diz: "Só abre depois que o merengue sair do forno."');
    return;
  }
  abrirModal('Câmara Fria', `
    <p>Com o merengue assado em mãos, você puxa a pesada porta de madeira. Um ar gelado sai lá de dentro.</p>
    <a class="btn-pixel" href="cena3.html">Entrar →</a>
  `);
}

ligar('#no-receita', 'Receita', abrirReceita);
ligar('#no-poster', 'Cartaz', abrirPoster);
ligar('#no-tabela', 'Pistas de conversão', abrirTabela);
ligar('#no-prancheta', 'Prancheta', abrirPrancheta);
ligar('#no-forno', 'Forno', abrirForno);
ligar('#no-porta', 'Porta', abrirPorta);

ligar('#no-calda', 'Frasco de calda', () => {
  if (estado.caldaPronta) {
    fala('A calda já está pronta e guardada.');
  } else if (estado.inventario.includes('termometro')) {
    fala('Selecione o termômetro digital no inventário e clique no frasco.');
  } else {
    fala('Um frasco de açúcar caramelizando sobre um fogareiro. Falta um termômetro para acertar o ponto da calda.');
  }
}, { termometro: abrirCalda });

ligar('#no-marmore', 'Bancada', () => {
  fala('O mármore está gelado como gelo. Serve para descongelar coisas devagar.');
}, {
  yuzu: () => {
    removerItem('yuzu');
    selecionado = null;
    estado.yuzuUsado = true;
    salvar();
    renderInventario();
    fala('Você deixou o yuzu sobre o mármore frio. Vai descongelar aos poucos, sem estragar.');
  }
});

const avisoForno = () => fala('Forno vazio e desligado. O visor mostra "ESTÁGIO 1 · TEMP °F: 176 → °C: --", mas só o forno de cima está com o merengue.');
ligar('#no-forno2', 'Forno', avisoForno);
ligar('#no-forno3', 'Forno', avisoForno);
ligar('#no-forno4', 'Forno', avisoForno);

ligar('#no-janela', 'Janela', () => fala('Uma janela com grades. Lá fora é noite e a luz esverdeada ilumina os frascos.'));
ligar('#no-frasco', 'Alambique', () => fala('Um alambique de vidro com um líquido marrom borbulhando devagar. O Chef devia fazer experiências aqui.'));
ligar('#no-extrato', 'Extrato de merengue', () => fala('Uma garrafa de extrato de merengue. Só serve para aromatizar, não é o que você procura.'));
ligar('#no-yuzu', 'Pote de yuzu', () => fala('Um pote com a etiqueta "Yuzu Congelada", mas só tem gelo derretido. O estoque de verdade deve estar na Câmara Fria.'));
ligar('#no-barril', 'Barril', () => fala('Um barril de metal enferrujado. Está vazio.'));
ligar('#no-caixote', 'Caixote', () => fala('Um caixote com potes de barro vazios. Nada útil.'));
ligar('#no-potes-meio', 'Potes', () => fala('Farinha, açúcar impalpável, tempero de confeiteiro e essências. Nenhuma baunilha rara por aqui.'));
ligar('#no-prateleira', 'Prateleira', () => fala('Mais potes de ingredientes: farinha, açúcar e temperos. Nada que você precise agora.'));
ligar('#no-panelas', 'Panelas', () => fala('Panelas empilhadas, sem uso há tempos.'));
ligar('#no-bicos', 'Bicos de confeitar', () => fala('Bicos de confeitar em formato de estrela e de gota. Vão servir no empratamento, lá no final.'));
ligar('#no-batedeira', 'Batedeira', () => fala('Uma batedeira industrial. O merengue já foi batido e está numa assadeira dentro do forno de cima. Falta só assar.'));

function formatar(seg) {
  const m = String(Math.floor(seg / 60)).padStart(2, '0');
  const s = String(seg % 60).padStart(2, '0');
  return m + ':' + s;
}
function fimDeJogo() {
  clearInterval(relogio);
  travado = true;
  try { sessionStorage.removeItem(CHAVE_ESTADO); } catch (e) {}
  abrirModal('FORA DO TEMPO!', `
    <p>O concurso começou sem você. O Chef abre a porta, furioso, e você está demitido antes de tocar na bancada.</p>
    <a class="btn-pixel" href="../index.html">Voltar ao menu</a>
  `);
}
function tick() {
  const restante = Math.max(0, Math.ceil((estado.fim - Date.now()) / 1000));
  const cron = $('#cronometro');
  cron.textContent = formatar(restante);
  cron.classList.toggle('urgente', restante <= 60);
  atualizarForno();
  if (restante <= 0) fimDeJogo();
}
const relogio = setInterval(tick, 1000);

renderInventario();
tick();
fala('Estação de Confeitaria. O merengue já está batido no forno de cima, mas os fornos estão apagados. Descubra as temperaturas certas.');
</script>
